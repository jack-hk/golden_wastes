media:
  - name: images
    label: Uploaded images
    input: static/uploads
    output: /uploads
    categories: [image]
    extensions: [png, jpg, jpeg, gif, webp, svg]
    rename: safe
  - name: wiki_icons
    label: Wiki SVG icons
    input: static/SVG
    output: /SVG
    extensions: [svg]
    categories: [image]
    rename: safe

settings:
  content:
    merge: true
  commit:
    identity: user
    templates:
      create: "content: create {path}"
      update: "content: update {path}"
      delete: "content: delete {path}"
      rename: "content: rename {oldPath} to {newPath}"

components:
  infobox:
    type: object
    label: Infobox
    required: false
    fields:
      - name: header
        label: Heading
        type: string
        required: false
      - name: image
        label: Image URL or repository path
        type: string
        required: false
      - name: icon
        label: Icon URL or /SVG path
        type: string
        required: false
      - name: iconSize
        label: Icon size
        type: number
        required: false
      - name: iconColor
        label: Icon colour (CSS value)
        type: string
        required: false
      - name: badgePath
        label: Badge URL or /SVG path
        type: string
        required: false
      - name: badgeSize
        label: Badge size
        type: number
        required: false
      - name: badgeForegroundColor
        label: Badge foreground colour
        type: string
        required: false
      - name: labels
        label: Infobox rows
        type: object
        list: true
        required: false
        fields:
          - name: label
            label: Label
            type: string
            required: false
          - name: item
            label: Value
            type: string
            required: false
          - name: divider
            label: Show divider
            type: boolean
            required: false

content:
  - name: articles
    label: Articles
    type: collection
    path: content/article
    format: yaml-frontmatter
    filename: "{primary}.md"
    fields:
      - { name: title, label: Title, type: string }
      - name: date
        label: Published date
        type: date
        required: false
        options:
          time: true
          format: "yyyy-MM-dd'T'HH:mm:ssXXX"
      - { name: draft, label: Draft, type: boolean, required: false }
      - name: type
        label: Layout type
        type: select
        options:
          values: [page, wiki]
      - name: categories
        label: Categories
        type: string
        list: true
      - { name: image, label: Featured image, type: string, required: false }
      - { name: show_date, label: Show date, type: boolean, required: false }
      - { name: show_reading_time, label: Show reading time, type: boolean, required: false }
      - { name: infobox, component: infobox }
      - { name: also, label: Related pages, type: string, list: true, required: false }
      - name: body
        label: Article body
        type: rich-text
        options: { format: markdown, media: images, switcher: true }
    view:
      fields: [title, date, draft, type]
      primary: title
      sort: [title]
      search: [title, body]

  - name: campaigns
    label: Campaigns
    type: collection
    path: content/campaign
    format: yaml-frontmatter
    filename: "{primary}.md"
    fields:
      - { name: title, label: Title, type: string }
      - name: date
        label: Published date
        type: date
        required: false
        options:
          time: true
          format: "yyyy-MM-dd'T'HH:mm:ssXXX"
      - { name: draft, label: Draft, type: boolean, required: false }
      - name: categories
        label: Categories
        type: string
        list: true
      - { name: eventDate, label: Campaign date, type: string, required: false }
      - { name: eventTime, label: Campaign time, type: string, required: false }
      - { name: image, label: Featured image, type: string, required: false }
      - { name: show_reading_time, label: Show reading time, type: boolean, required: false }
      - name: body
        label: Campaign body
        type: rich-text
        options: { format: markdown, media: images, switcher: true }
    view:
      fields: [title, date, draft]
      primary: title
      sort: [title]
      search: [title, body]

  - name: monsters
    label: Monsters
    type: collection
    path: content/monster
    format: yaml-frontmatter
    filename: "{primary}.md"
    fields:
      - { name: title, label: Name, type: string }
      - name: type
        label: Layout type
        type: select
        options:
          values: [wiki, page]
      - name: categories
        label: Categories
        type: string
        list: true
      - { name: image, label: Featured image, type: string, required: false }
      - { name: show_date, label: Show date, type: boolean, required: false }
      - { name: show_reading_time, label: Show reading time, type: boolean, required: false }
      - { name: infobox, component: infobox }
      - { name: also, label: Related pages, type: string, list: true, required: false }
      - name: body
        label: Monster body
        type: rich-text
        options: { format: markdown, media: images, switcher: true }
    view:
      fields: [title, type, infobox.header]
      primary: title
      sort: [title]
      search: [title, infobox.labels, body]

  - name: locations
    label: Locations
    type: collection
    path: content/location
    format: yaml-frontmatter
    filename: "{primary}.md"
    fields:
      - { name: title, label: Name, type: string }
      - name: type
        label: Layout type
        type: select
        options:
          values: [wiki, page]
      - name: categories
        label: Categories
        type: string
        list: true
      - { name: image, label: Featured image, type: string, required: false }
      - { name: show_date, label: Show date, type: boolean, required: false }
      - { name: show_reading_time, label: Show reading time, type: boolean, required: false }
      - { name: infobox, component: infobox }
      - { name: also, label: Related pages, type: string, list: true, required: false }
      - name: body
        label: Location body
        type: rich-text
        options: { format: markdown, media: images, switcher: true }
    view:
      fields: [title, type, infobox.header]
      primary: title
      sort: [title]
      search: [title, infobox.labels, body]

  - name: classes
    label: Classes
    type: collection
    path: content/class
    format: yaml-frontmatter
    filename: "{primary}.md"
    fields:
      - { name: title, label: Class name, type: string }
      - { name: header, label: Page heading, type: string, required: false }
      - name: type
        label: Layout type
        type: select
        options:
          values: [wiki, page]
      - name: categories
        label: Categories
        type: string
        list: true
      - { name: image, label: Featured image, type: string, required: false }
      - { name: show_date, label: Show date, type: boolean, required: false }
      - { name: show_reading_time, label: Show reading time, type: boolean, required: false }
      - { name: infobox, component: infobox }
      - { name: also, label: Related pages, type: string, list: true, required: false }
      - name: body
        label: Class body
        type: rich-text
        options: { format: markdown, media: images, switcher: true }
    view:
      fields: [title, header, type, infobox.header]
      primary: title
      sort: [title]
      search: [title, header, infobox.labels, body]

  - name: category_portals
    label: Category portals
    type: collection
    path: content/categories
    format: yaml-frontmatter
    subfolders: true
    filename: "{primary}.md"
    fields:
      - { name: title, label: Title, type: string }
      - name: portal_view
        label: Portal layout
        type: select
        options:
          values: [list, card]
      - { name: showcase_tiles, label: Showcase count, type: number, required: false }
      - { name: min_showcase_tiles, label: Minimum showcase count, type: number, required: false }
      - { name: card_count, label: Card count, type: number, required: false }
      - { name: min_card_count, label: Minimum card count, type: number, required: false }
      - { name: truncate_limit, label: Description limit, type: number, required: false }
      - { name: carousel_on_desktop, label: Desktop carousel, type: boolean, required: false }
      - { name: show_alphabet, label: Show alphabet, type: boolean, required: false }
      - { name: show_layout_toggle, label: Show layout toggle, type: boolean, required: false }
      - name: list_layout
        label: Default list layout
        type: select
        required: false
        options:
          values: [fixed, masonry]
      - { name: show_intro_text, label: Show intro text, type: boolean, required: false }
      - { name: intro_text, label: Intro text, type: string, required: false }
      - { name: show_left_textbox, label: Show left textbox, type: boolean, required: false }
      - { name: left_textbox_title, label: Left textbox title, type: string, required: false }
      - { name: left_textbox_text, label: Left textbox text, type: string, required: false }
      - { name: show_right_textbox, label: Show right textbox, type: boolean, required: false }
      - { name: right_textbox_title, label: Right textbox title, type: string, required: false }
      - { name: right_textbox_text, label: Right textbox text, type: string, required: false }
      - { name: show_bottom_textbox, label: Show bottom textbox, type: boolean, required: false }
      - { name: bottom_textbox_text, label: Bottom textbox text, type: string, required: false }
      - name: body
        label: Portal body
        type: rich-text
        options: { format: markdown, media: images, switcher: true }
    view:
      fields: [title, portal_view]
      primary: title
      sort: [title]
      search: [title]

  - name: home
    label: Home page
    type: file
    path: content/_index.md
    format: toml-frontmatter
    fields:
      - { name: title, label: Title, type: string }
      - name: date
        label: Date
        type: date
        required: false
        options:
          time: true
          format: "yyyy-MM-dd'T'HH:mm:ssXXX"
      - { name: draft, label: Draft, type: boolean, required: false }
      - name: body
        label: Content
        type: rich-text
        options: { format: markdown, media: images, switcher: true }
