baseURL = "https://goldenwastes.wiki/"
languageCode = "en-US"
title = "Golden Wastes"

[module]
[[module.mounts]]
source = "layouts"
target = "layouts"

[[module.mounts]]
source = "themes/cleanwiki/layouts"
target = "layouts"

[[module.mounts]]
source = "themes/cleanwiki/assets"
target = "assets"

[[module.mounts]]
source = "themes/cleanwiki/static"
target = "static"

[[module.mounts]]
source = "assets"
target = "assets"

[[module.mounts]]
source = "static"
target = "static"

[module.hugoVersion]
extended = false
min = "0.146.0"

[params]
enablePagefindCSS = false
subtitle = "A Brutal TTRPG Adventure"

[params.pagefind]
  initialPageSize = 5
  loadMoreCount = 5
  showSubResults = true
  showImages = true
  debounceTimeoutMs = 300
  excerptLength = 30

  [params.pagefind.thumbnailSources]
    primary = "image"
    fallback1 = "thumbnail"
    fallback2 = "featured"

  placeholderImage = "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 0x400'%3E%3Crect fill='%23e5e7eb' width='400' height='400'/%3E%3Ctext x='50%25' y='50%25' font-size='24' fill='%23999' text-anchor='middle' dy='.3em'%3ENo Image%3C/text%3E%3C/svg%3E"

[params.infoboxBadges]
  showOnThumbnails = true

[params.pageLayout]
showHeader = true
showMeta = true
showTaxonomies = true
showFeaturedImage = true
showSeries = true
showUpdated = true
showReferences = true
showTaxonomyIcons = true
showReadingTime = false
metaBelowContent = false
taxonomiesBelowContent = false

[params.wiki]
show_date = false

[params.breadcrumbs]
enabled = true
separator = "/"
show_taxonomies = true
taxonomy_blacklist = ["campaign"]

[params.navbarBar]
iconsHaveLabels = false
iconSeparator = true

[params.pagesCMS]
baseURL = "https://app.pagescms.org"
owner = "jack-hk"
repo = "golden_wastes"
branch = "production"

[params.smallTiles]
type = "categories"

[params.bigTiles]
count = 3
truncate = 130
pages = [
  "/article/the-project",
  "/article/how-to-play",
  "/article/the-wastes",
]

[params.smallTiles.images]
monster = "/uploads/monster.jpg"
article = "/uploads/blue-abstract.jpg"
class = "/uploads/tools.jpg"
campaign = "/uploads/red-abstract.jpg"
location = "/uploads/cave.jpg"

[params.bigTiles.partials]
article = "big-tile-article.html"
quote = "big-tile-quote.html"

[params.portal]
  default_view = "list"
  showcase_tiles = 3
  min_showcase_tiles = 3
  show_layout_toggle = true
  default_list_layout = "fixed"
  show_intro_text = true
  intro_text = "Browse all articles related to {title} in the {taxonomy} taxonomy."
  show_left_textbox = true
  left_textbox_title = "About This Category"
  left_textbox_text = "You're viewing all articles tagged under {title}."
  show_right_textbox = true
  right_textbox_title = "Get Involved"
  right_textbox_text = "Contribute your own articles or suggest related topics to enrich this section."
  show_bottom_textbox = true
  bottom_textbox_text = "Lorem Ipsum is simply dummy text of the printing and typesetting industry."
  show_alphabet = true
  truncate_limit = 130

[params.portalCard]
  card_count = 3
  min_card_count = 3
  random_cards = true
  cards = []
  truncate_limit = 100
  carousel_on_desktop = false
  show_intro_text = true
  intro_text = "Choose your path. Each class offers unique abilities and playstyles in the brutal world of Golden Wastes."
  show_bottom_textbox = true
  bottom_textbox_text = "The cards have spoken. Choose your path wisely."

[params.navigationMenu]
  headerIcon = "sun"
  headerTitle = "Golden Wastes"
  mobileLogo = "/logo.png"
  mobileLogoDark = "/logo-dark.png"
  mobileLogoSmall = "/logo-s.png"
  mobileLogoDarkSmall = "/logo-dark-s.png"
  subtitle = "Explore"
  columnsOnDesktop = 2
  showFooter = false
  footerText = ""
  showExternalLinks = true
  externalLinksSubtitle = "External Links"

  # External links configuration
  # Set showExternalLinks = false to disable the external links section entirely
  # Add external links that will appear in a separate section below the second separator
  # Each link should have: name (required), url (required), pre (optional), title (optional)
  # Available icons (pre parameter): sun, sun-logo, animal-skull, bestial-fangs, dice, graduate, 
  # sword-in-stone, torch, paint-brush, bars, category, cog, house, search, tag
  # You can also omit the pre parameter to show link without an icon
  
  [[params.navigationMenu.externalLinks]]
    name = "Join our Discord!"
    url = "https://discord.gg/qezpwPvDpr"
    pre = "discord"
    title = "Join our Discord!"

[menus]

[[menus.main]]
name = "Home"
pre = "sun-logo"
pageRef = "/"
weight = 10

  [menus.main.params]
  separator = true

[[menus.main]]
name = "Search"
pre = "search"
weight = 20

  [menus.main.params]
  event = "scrollToTopOfElement('popover-search')"
  popover = true
  popoverContentPartial = "popovers/search.html"

[[menus.main]]
name = "Navigation"
pre = "bars"
weight = 30

  [menus.main.params]
  event = "scrollToTopOfElement('popover-navigation')"
  popover = true
  popoverContentPartial = "popovers/navigation.html"

[[menus.main]]
name = "Edit"
pre = "pencil"
weight = 40

  [menus.main.params]
  InBottom = true
  editCurrentPage = true

[[menus.main]]
name = "Settings"
pre = "cog"
weight = 45

  [menus.main.params]
  InBottom = true
  popover = true
  popoverContentPartial = "popovers/settings.html"

[[menus.navigation]]
name = "How To Play"
pre = "graduate"
pageRef = "/article/how-to-play"
weight = 10

  [menus.navigation.params]
  group = "learn"

[[menus.navigation]]
name = "The Wastes"
pre = "animal-skull"
pageRef = "/article/the-wastes"
weight = 20

  [menus.navigation.params]
  group = "learn"

[[menus.navigation]]
name = "Classes"
pre = "sword-in-stone"
pageRef = "/categories/class"
weight = 40

  [menus.navigation.params]
  group = "play"

[[menus.navigation]]
name = "Bestiary"
pre = "bestial-fangs"
pageRef = "/categories/monster"
weight = 60

  [menus.navigation.params]
  group = "play"
