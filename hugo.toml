baseURL = "https://example.org/"
languageCode = "en-US"
title = "Golden Wastes"

[module]
[[module.mounts]]
source = "themes/cleanwiki/layouts"
target = "layouts"

[[module.mounts]]
source = "themes/cleanwiki/assets"
target = "assets"

[[module.mounts]]
source = "themes/cleanwiki/static"
target = "static"

[[module.mounts]]
source = "layouts"
target = "layouts"

[[module.mounts]]
source = "assets"
target = "assets"

[[module.mounts]]
source = "static"
target = "static"

[module.hugoVersion]
extended = false
min = "0.146.0"

[params]
enablePagefindCSS = false
subtitle = "A Brutal TTRPG Adventure"

[params.pagefind]
  initialPageSize = 5
  loadMoreCount = 5
  showSubResults = true
  showImages = true
  debounceTimeoutMs = 300
  excerptLength = 30

  [params.pagefind.thumbnailSources]
    primary = "image"
    fallback1 = "thumbnail"
    fallback2 = "featured"

  placeholderImage = "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 0x400'%3E%3Crect fill='%23e5e7eb' width='400' height='400'/%3E%3Ctext x='50%25' y='50%25' font-size='24' fill='%23999' text-anchor='middle' dy='.3em'%3ENo Image%3C/text%3E%3C/svg%3E"

[params.pageLayout]
showHeader = true
showMeta = true
showTaxonomies = true
showFeaturedImage = true
showSeries = true
showUpdated = true
showReferences = true
showTaxonomyIcons = true
metaBelowContent = false
taxonomiesBelowContent = false

[params.breadcrumbs]
enabled = true
separator = "/"
show_taxonomies = true
taxonomy_blacklist = ["campaign"]

[params.navbarBar]
iconsHaveLabels = false
iconSeparator = true

[params.smallTiles]
type = "categories"

[params.bigTiles]
count = 3
truncate = 130

[params.smallTiles.images]
article = "https://cdnb.artstation.com/p/assets/images/images/031/091/817/large/kate-vigdis-.jpg?1602586366"
campaign = "https://cdnb.artstation.com/p/assets/images/images/000/388/611/large/wes-wheeler-crystal-cavern-01-by-wwsketch-d7kdc41.jpg?1420507158"
event = "https://thumbs.dreamstime.com/b/painting-desert-blue-sky-background-done-watercolor-351087324.jpg"
class = "https://olddungeonmaster.com/wp-content/uploads/2020/08/player-equipment.jpg?w=640"

[params.bigTiles.partials]
article = "big-tile-article.html"
quote = "big-tile-quote.html"
event = "big-tile-event.html"

[params.portal]
  default_view = "list"
  showcase_tiles = 3
  min_showcase_tiles = 3
  show_alphabet = true
  truncate_limit = 130

[params.portalCard]
  card_count = 3
  min_card_count = 3
  truncate_limit = 100
  carousel_on_desktop = false

[params.navigationMenu]
  headerIcon = "sun"
  headerTitle = "Golden Wastes"
  subtitle = "Explore"
  columnsOnDesktop = 2
  showFooter = false
  footerText = ""

[menus]

[[menus.main]]
name = "Home"
pre = "sun-logo"
pageRef = "/"
weight = 10

  [menus.main.params]
  separator = true

[[menus.main]]
name = "Search"
pre = "search"
weight = 20

  [menus.main.params]
  event = "scrollToTopOfElement('popover-search')"
  popover = true
  popoverContentPartial = "popovers/search.html"

[[menus.main]]
name = "Navigation"
pre = "bars"
weight = 30

  [menus.main.params]
  event = "scrollToTopOfElement('popover-navigation')"
  popover = true
  popoverContentPartial = "popovers/navigation.html"

[[menus.main]]
name = "Settings"
pre = "cog"
weight = 40

  [menus.main.params]
  InBottom = true
  popover = true
  popoverContentPartial = "popovers/settings.html"

[[menus.navigation]]
name = "How To Play"
pre = "graduate"
pageRef = "/rules/how to play"
weight = 10

  [menus.navigation.params]
  group = "learn"

[[menus.navigation]]
name = "The Wastes"
pre = "animal-skull"
pageRef = "/posts/introduction"
weight = 20

  [menus.navigation.params]
  group = "learn"

[[menus.navigation]]
name = "Events"
pre = "dice"
pageRef = "/categories/event"
weight = 30

  [menus.navigation.params]
  group = "learn"

[[menus.navigation]]
name = "Classes"
pre = "sword-in-stone"
pageRef = "/categories/class"
weight = 40

  [menus.navigation.params]
  group = "play"

[[menus.navigation]]
name = "Equipment"
pre = "torch"
pageRef = "/rules"
weight = 50

  [menus.navigation.params]
  group = "play"

[[menus.navigation]]
name = "Bestiary"
pre = "bestial-fangs"
pageRef = "/rules"
weight = 60

  [menus.navigation.params]
  group = "play"
