baseURL = "https://example.org/"
languageCode = "en-US"
title = "Golden Wastes"

[module]
[[module.mounts]]
source = "themes/cleanwiki/layouts"
target = "layouts"

[[module.mounts]]
source = "themes/cleanwiki/assets"
target = "assets"

[[module.mounts]]
source = "themes/cleanwiki/static"
target = "static"

[[module.mounts]]
source = "layouts"
target = "layouts"

[[module.mounts]]
source = "assets"
target = "assets"

[[module.mounts]]
source = "static"
target = "static"

[module.hugoVersion]
extended = false
min = "0.146.0"

[params]
enablePagefindCSS = true
subtitle = "A Brutal TTRPG Adventure"

[params.pageLayout]
showHeader = true
showMeta = true
showTaxonomies = true
showFeaturedImage = true
showSeries = true
showUpdated = true
showReferences = true
showTaxonomyIcons = true
metaBelowContent = false
taxonomiesBelowContent = false

[params.breadcrumbs]
enabled = true
separator = "/"

[params.navbarBar]
iconsHaveLabels = false
iconSeparator = true

[params.smallTiles]
type = "categories"

[params.bigTiles]
count = 3
truncate = 130

[params.smallTiles.images]
article = "https://cdnb.artstation.com/p/assets/images/images/031/091/817/large/kate-vigdis-.jpg?1602586366"
campaign = "https://cdnb.artstation.com/p/assets/images/images/000/388/611/large/wes-wheeler-crystal-cavern-01-by-wwsketch-d7kdc41.jpg?1420507158"
event = "https://thumbs.dreamstime.com/b/painting-desert-blue-sky-background-done-watercolor-351087324.jpg"
class = "https://olddungeonmaster.com/wp-content/uploads/2020/08/player-equipment.jpg?w=640"

[params.bigTiles.partials]
article = "big-tile-article.html"
quote = "big-tile-quote.html"
event = "big-tile-event.html"

[params.portal]
  showcase_tiles = 3
  show_alphabet = true
  truncate_limit = 130

[menus]

# --- Menu Item: Home ---
[[menus.main]]
name = "Home"
pre = "sun-logo"
pageRef = "/"
weight = 10

  [menus.main.params]
  separator = true

# --- Menu Item: Search ---
[[menus.main]]
name = "Search"
pre = "search"
weight = 20

  [menus.main.params]
  event = "scrollToTopOfElement('popover-search')"
  popover = true
  popoverContentPartial = "popovers/search.html"

# --- Menu Item: Navigation ---
[[menus.main]]
name = "Navigation"
pre = "bars"
weight = 30

  [menus.main.params]
  event = "scrollToTopOfElement('popover-navigation')"
  popover = true
  popoverContentPartial = "popovers/navigation.html"

# --- Menu Item: Settings ---
  [[menus.main]]
name = "Settings"
pre = "cog"
weight = 40

  [menus.main.params]
  InBottom = true
  popover = true
  popoverContentPartial = "popovers/settings.html"

