<header class="popover-settings__header">
  <h2 class="popover-settings__title">Settings</h2>
  <button
    class="popover-navigation__close"
    popovertarget="Settings"
    popovertargetaction="hide"
    aria-label="Close settings">
    <svg
      xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
      aria-hidden="true">
      <line x1="18" y1="6" x2="6" y2="18"></line>
      <line x1="6" y1="6" x2="18" y2="18"></line>
    </svg>
  </button>
</header>
<span class="popover-settings__separator" aria-hidden="true"></span>
<section class="popover-settings__section">
  <div class="popover-settings__row">
    <fieldset class="theme-toggle" id="theme-switcher">
      <legend class="theme-toggle__label">Theme</legend>

      <label class="theme-toggle__option">
        <input type="radio" name="theme" value="auto" checked />
        Auto
      </label>

      <label class="theme-toggle__option">
        <input type="radio" name="theme" value="light" />
        Light
      </label>

      <label class="theme-toggle__option">
        <input type="radio" name="theme" value="dark" />
        Dark
      </label>
    </fieldset>
  </div>
</section>
